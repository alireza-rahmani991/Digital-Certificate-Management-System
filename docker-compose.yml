# Use postgres/example user/password credentials

services:

  db:
    image: postgres:18
    container_name: digital_certificate
    restart: always
    
    shm_size: 128mb
    
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: digital_certificate

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql
  
volumes:
  postgres_data: